[package]
name = "testrix-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "testrix"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
gpui-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
testrix-core.workspace = true
testrix-http.workspace = true
testrix-storage.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-yaml", "tree-sitter-html", "test-support"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Testrix"
identifier = "io.testrix.app"
icon = ["assets/AppIcon.icns", "assets/icon-1024.png", "assets/icon.png"]
short_description = "Testrix — YAML API Workbench"
